name = "avital-heal-crm"
main = "index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "avital-heal-crm"
database_id = "8e1ab564-8b00-4b2f-a0f1-99fbdab95bfc"

[vars]
# Non-secret variables can go here

# Secret variables (set via `wrangler secret put`):
# JWT_SECRET — signing secret for login session tokens
# TURNSTILE_SECRET_KEY — Cloudflare Turnstile secret, required on every public form endpoint
# RESET_EMAIL_SCRIPT_URL — Google Apps Script webhook for password-reset and notification emails
#
# CRM_AUTH_TOKEN / CRM_PASSWORD belonged to the legacy static-token auth scheme
# (worker/crm-worker.js, removed) and are not used by the current JWT-based auth in auth.js.
