<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הדף לא נמצא | להיות המרפאה של עצמי</title>
  <meta name="robots" content="noindex, follow">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    *{ box-sizing: border-box; margin:0; padding:0; }
    body{
      font-family:'Heebo', 'Arial Hebrew', Arial, sans-serif;
      min-height:100vh; direction:rtl;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:32px;
      background: linear-gradient(160deg, #1a0835 0%, #2a1260 50%, #130828 100%);
      color:#e8d8ff;
    }
    h1{ font-size:1.8rem; margin-bottom:12px; color:#D4AF37; }
    p{ font-size:1rem; color:#c4b0e0; margin-bottom:28px; max-width:420px; line-height:1.7; }
    a.btn{
      display:inline-block; background: linear-gradient(135deg, #D4AF37, #b08d20);
      color:#1a0835; font-weight:700;
      padding:14px 32px; border-radius:999px; text-decoration:none;
    }
    a.btn:hover{ opacity:0.9; }
  </style>
</head>
<body>
  <h1>הדף שחיפשת לא נמצא</h1>
  <p>ייתכן שהקישור שגוי או שהדף הוסר. אפשר לחזור לברושור הסדנה.</p>
  <a class="btn" href="/">חזרה לברושור</a>
</body>
</html>
